<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9A1428" stop-opacity="1"/>
      <stop offset="40%" stop-color="#D61F3C" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#D61F3C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D61F3C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7A0E1F" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#A8162E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A8162E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D61F3C" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#D61F3C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#D61F3C" stop-opacity="0"/>
    </radialGradient>
    <filter id="softblur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.4
                             0 0 0 0 0.35
                             0 0 0 0 0.3
                             0 0 0 0.18 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#F0EAD2"/>

  <g filter="url(#softblur)">
    <ellipse cx="380" cy="360" rx="640" ry="560" fill="url(#blob1)"/>
    <ellipse cx="720" cy="820" rx="520" ry="460" fill="url(#blob2)"/>
    <ellipse cx="180" cy="700" rx="380" ry="340" fill="url(#blob3)"/>
    <ellipse cx="1100" cy="500" rx="280" ry="240" fill="url(#blob3)"/>
  </g>

  <rect width="1920" height="1080" fill="#F0EAD2" filter="url(#grain)" opacity="0.55"/>
  <rect width="1920" height="1080" fill="#F0EAD2" opacity="0.05"/>
</svg>
